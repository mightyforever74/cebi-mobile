name: Android Production AAB Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version Code (örn: 20)"
        required: true
        default: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat > .env << EOF
          API_URL=https://api.tulipfleet.com
          MQTT_HOST=46.224.1.192
          MQTT_PORT=8883
          MQTT_USE_SSL=true
          MQTT_USERNAME=fleet-backend
          MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}
          MQTT_CLIENT_ID=tulipfleet_mobile
          MQTT_BROKER_URL=mqtts://46.224.1.192:8883
          EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tulipfleet-upload-new.keystore

      - name: Update versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle

      - name: Verify resolved Android dependencies
        run: |
          cd android
          ./gradlew app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.appcompat:appcompat
          ./gradlew app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.appcompat:appcompat-resources
          ./gradlew app:dependencyInsight --configuration releaseRuntimeClasspath --dependency com.google.android.material:material

      - name: Build AAB
        env:
          KEYSTORE_FILE: tulipfleet-upload-new.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew clean bundleRelease --no-daemon --stacktrace --info

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tulipfleet-release-v${{ github.event.inputs.version_code }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

